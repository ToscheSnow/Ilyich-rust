[package]
name = "rplay"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.3"
rng = "0.1.0"
bytes = "1"
tokio = { version = "1.53.1", features = ["full"] }
sha1 =  "0.10"
hex = "0.4"
ratatui = "0.29"
memory-stats = "1"
futures = "0.3.34"

[profile.dev.package."*"]
opt-level = 3


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

